                {"question": "She decided to __________ for a new job at the airline.", "options": ["apply", "handle", "improve", "upgrade"], "correct": 0},
                {"question": "If I had not followed my __________, I could be very unhappy now.", "options": ["mind", "heart", "head", "clue"], "correct": 1},
                {"question": "A __________ is a person who helps passengers on an aircraft.", "options": ["pilot", "flight attendant", "engineer", "manager"], "correct": 1},
                {"question": "There is a __________ chance that you might succeed if you try.", "options": ["slight", "broad", "large", "heavy"], "correct": 0},
                {"question": "The university __________ I studied is very old.", "options": ["where", "which", "who", "whose"], "correct": 0},
                {"question": "The teacher __________ me on passing the exam.", "options": ["congratulated", "denied", "insisted", "reminded"], "correct": 0}
            ]
        };

        // App Logic (same as before, now supports 5 units)
        let currentQuestions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let totalQuestionsCount = 0;

        const menuScreen = document.getElementById('menuScreen');
        const quizScreen = document.getElementById('quizScreen');
        const loadingArea = document.getElementById('loadingArea');
        const quizArea = document.getElementById('quizArea');
        const resultArea = document.getElementById('resultArea');
        const unitTitleSpan = document.getElementById('unitTitle');
        const progressTextSpan = document.getElementById('progressText');
        const progressFillDiv = document.getElementById('progressFill');
        const questionTextDiv = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const backToMenuBtn = document.getElementById('backToMenuBtn');
        const returnToMenuBtn = document.getElementById('returnToMenuBtn');
        const comprehensiveBtn = document.getElementById('comprehensiveBtn');

        function loadQuestions(unitKey, isComprehensive = false) {
            loadingArea.classList.remove('hidden');
            quizArea.classList.add('hidden');
            resultArea.classList.add('hidden');
            setTimeout(() => {
                let selected = [];
                if (isComprehensive) {
                    let all = [];
                    for (let u in ENGLISH_QUESTIONS) all.push(...ENGLISH_QUESTIONS[u]);
                    for (let i = all.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [all[i], all[j]] = [all[j], all[i]];
                    }
                    selected = all.slice(0, 100);
                } else {
                    if (ENGLISH_QUESTIONS[unitKey]) selected = [...ENGLISH_QUESTIONS[unitKey]];
                    else selected = [];
                }
                if (!selected.length) { alert('No questions found'); backToMenu(); return; }
                currentQuestions = selected;
                totalQuestionsCount = currentQuestions.length;
                userAnswers = Array(totalQuestionsCount).fill(null);
                currentIndex = 0;
                renderCurrentQuestion();
                loadingArea.classList.add('hidden');
                quizArea.classList.remove('hidden');
                updateProgressBarAndText();
            }, 200);
        }

        function renderCurrentQuestion() {
            if (!currentQuestions.length) return;
            const q = currentQuestions[currentIndex];
            questionTextDiv.innerHTML = q.question;
            optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (userAnswers[currentIndex] === idx) btn.classList.add('selected');
                btn.innerHTML = `${letters[idx]}. ${opt}`;
                btn.addEventListener('click', () => {
                    if (userAnswers[currentIndex] !== idx) {
                        userAnswers[currentIndex] = idx;
                        highlightSelectedOption();
                    }
                });
                optionsContainer.appendChild(btn);
            });
            prevBtn.style.display = currentIndex === 0 ? 'none' : 'inline-block';
            if (currentIndex === totalQuestionsCount - 1) {
                if (!document.getElementById('nextFinishBtn')) {
                    const finishBtn = document.createElement('button');
                    finishBtn.id = 'nextFinishBtn';
                    finishBtn.className = 'nav-btn';
                    finishBtn.textContent = 'Finish Exam 🎯';
                    finishBtn.addEventListener('click', showResults);
                    prevBtn.parentNode.appendChild(finishBtn);
                }
                const nextNormal = document.getElementById('nextNormalBtn');
                if (nextNormal) nextNormal.remove();
            } else {
                const existingFinish = document.getElementById('nextFinishBtn');
                if (existingFinish) existingFinish.remove();
                if (!document.getElementById('nextNormalBtn')) {
                    const nextBtn = document.createElement('button');
                    nextBtn.id = 'nextNormalBtn';
                    nextBtn.className = 'nav-btn';
                    nextBtn.textContent = 'Next ➡';
                    nextBtn.addEventListener('click', () => {
                        if (currentIndex < totalQuestionsCount - 1) {
                            currentIndex++;
                            renderCurrentQuestion();
                            updateProgressBarAndText();
                        }
                    });
                    prevBtn.parentNode.appendChild(nextBtn);
                }
            }
            updateProgressBarAndText();
        }

        function highlightSelectedOption() {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((btn, idx) => {
                if (userAnswers[currentIndex] === idx) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });
        }

        function updateProgressBarAndText() {
            progressTextSpan.innerText = `Question ${currentIndex+1} / ${totalQuestionsCount}`;
            let percent = (currentIndex / totalQuestionsCount) * 100;
            progressFillDiv.style.width = percent + '%';
        }

        function showResults() {
            let score = 0;
            let reviewHtml = '';
            for (let i = 0; i < totalQuestionsCount; i++) {
                const userAns = userAnswers[i];
                const correctAns = currentQuestions[i].correct;
                const isCorrect = (userAns === correctAns);
                if (isCorrect) score++;
                const qText = currentQuestions[i].question;
                const userOption = userAns !== null ? currentQuestions[i].options[userAns] : 'Not answered';
                const correctOption = currentQuestions[i].options[correctAns];
                const statusClass = isCorrect ? 'review-correct' : 'review-wrong';
                reviewHtml += `<div class="review-item ${statusClass}"><strong>❓ Q:</strong> ${qText}<br><span>📌 Your answer: ${userOption}</span><br><span>✅ Correct: ${correctOption}</span></div>`;
            }
            const percentage = ((score / totalQuestionsCount) * 100).toFixed(1);
            let message = percentage >= 85 ? '🏆 Excellent! Mastery of English! 🏆' : percentage >= 65 ? '📘 Good job, review a bit more' : percentage >= 50 ? '📖 Fair, keep practicing' : '📚 Needs improvement, study again';
            document.getElementById('scoreValue').innerText = score;
            document.getElementById('totalQuestionsValue').innerText = totalQuestionsCount;
            document.getElementById('resultMessage').innerHTML = message;
            document.getElementById('resultPercentage').innerHTML = `Percentage: ${percentage}%`;
            document.getElementById('answersReview').innerHTML = reviewHtml;
            quizArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
        }

        function backToMenu() {
            menuScreen.classList.remove('hidden');
            quizScreen.classList.add('hidden');
            currentQuestions = [];
        }

        function startQuiz(unit, isComprehensive = false) {
            menuScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            if (isComprehensive) unitTitleSpan.innerText = '📜 Comprehensive Exam (100 questions)';
            else {
                const titles = { unit1: '📖 Unit 1: Communication (Present Tenses)', unit2: '🏡 Unit 2: Lifestyles (Articles & Modals)', unit3: '🤝 Unit 3: Social Issues (Reported Speech)', unit4: '💻 Unit 4: Digital World (Passive & Conditionals)', unit5: '❤️ Unit 5: Follow Your Heart (Relative Clauses)' };
                unitTitleSpan.innerText = titles[unit] || 'English Test';
            }
            loadQuestions(unit, isComprehensive);
        }

        document.querySelectorAll('.menu-btn:not(#comprehensiveBtn)').forEach(btn => {
            btn.addEventListener('click', () => { const unit = btn.getAttribute('data-unit'); if (unit) startQuiz(unit, false); });
        });
        comprehensiveBtn.addEventListener('click', () => startQuiz('comprehensive', true));
        backToMenuBtn.addEventListener('click', backToMenu);
        returnToMenuBtn.addEventListener('click', backToMenu);
        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderCurrentQuestion(); updateProgressBarAndText(); } });
    </script>
</body>
</html>
